[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linope"
version = "0.1.0"
description = "Linope kernel and terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "openai",
    "anthropic",
    "google-genai",
    "ddgs",
    "mcp",
    "httpx",
    "brotlicffi",
    "PyYAML",
]

[project.urls]
Homepage = "https://github.com/answeryt/Linope"

[project.scripts]
linope = "tui.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tui*", "kernel*", "capability*", "bindings*"]
exclude = ["*.tests", "*.tests.*", "*node_modules*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.toml", "*.ts", "*.js", "*.mjs"]

[tool.setuptools.exclude-package-data]
"*" = [".env", "**/.env", "*.test.mjs"]
