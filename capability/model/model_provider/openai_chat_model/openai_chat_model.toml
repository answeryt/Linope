provider = "openai"
interface = "openai_chat"
model = "your-openai-chat-model"
api_key_env = "OPENAI_API_KEY"
organization_env = "OPENAI_ORGANIZATION"
base_url = "https://api.openai.com/v1"
stream = true

[parameters]
max_tokens = "UNSET"
temperature = "UNSET"
top_p = "UNSET"
thinking_enable = "UNSET"
reasoning_effort = "UNSET"
parallel_tool_calls = "UNSET"
tools = "UNSET"
tool_choice = "UNSET"
voice = "UNSET"

[client_kwargs]
timeout = 60.0

[generate_kwargs]

[extra_body]

[[messages]]
role = "user"
content = "Reply with the single word pong."

[[context]]
role = "system"
content = "You remember a secret token. When asked, reply with only that token."

[[context]]
role = "user"
content = "The secret token is indigo-token."

[[context]]
role = "assistant"
content = "Understood."

[[context]]
role = "user"
content = "What is the secret token?"
