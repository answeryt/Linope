paths = [
  "tools/external_tools/ci_tools/generate/serve_generate",
  "tools/external_tools/ci_tools/generate/session_generate",
  "tools/external_tools/ci_tools/generate/third_party_generate.py",
  "kernel/thred/plugin/src",
  "kernel/thred/plugin/testing",
  "kernel/thred/plugin/scripts",
  "kernel/thred/plugin/manager/stevedore",
]

[inject]
message_tokens = ["text_estimator"]
process_lifecycle = ["store", "transition", "build_process_run"]
process_runtime = ["processes", "store", "journal", "lifecycle", "continuation_builder", "scheduler"]
continuation_scheduler = ["continuations", "processes", "dispatch"]
process_worker = ["queue", "runtime"]
usecase = ["runtime"]
app = ["application"]
stream_subscriber = ["consume"]
sandbox_policy = ["canonical_path", "effective_mode"]
sandbox_policy_plugin = ["canonical_path", "effective_mode"]
sandbox_local = ["bwrap_profile_args", "landlock_profile_args", "seatbelt_profile_args"]
sandbox_local_plugin = ["bwrap_profile_args", "landlock_profile_args", "seatbelt_profile_args"]
sandbox_profiles = ["writable_roots"]
profiles_plugin = ["writable_roots"]
ui_cli_plugin = ["parse_startup", "create_server", "mount_shell", "mount_static", "announce", "resolve_dist_index"]
ui_static_plugin = ["register_fallback", "apply_index_taps"]

[kernel_layers]
services = ["app", "ingress", "worker", "queue", "store", "scheduler"]
process = ["activation", "definition", "runtime", "journal", "lifecycle", "state", "handle", "continuation"]
thred = ["binding", "definition", "executor"]
resource = ["definition", "pool"]

[sockets.exec_command]
bash = "tools/agent_tools/shell_tools/bash_plugin.py"
pwsh = "tools/agent_tools/shell_tools/pwsh_plugin.py"
bash_persistent = "tools/agent_tools/shell_tools/bash_persistent_plugin.py"
